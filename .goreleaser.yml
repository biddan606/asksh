version: 2

project_name: asksh

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: asksh
    main: ./main.go
    binary: asksh
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: asksh
    builds:
      - asksh
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

brews:
  - name: asksh
    repository:
      owner: biddan606
      name: homebrew-asksh
    homepage: "https://github.com/biddan606/asksh"
    description: "Translate natural language to shell commands using local Ollama or OpenAI"
    license: "MIT"
    install: |
      bin.install "asksh"
    test: |
      system "#{bin}/asksh", "--version"
